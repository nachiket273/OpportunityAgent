[project]
name = "opportunityagent"
version = "0.1.0"
description = "an open-source autonomous job discovery system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["opportunity_agent"]
